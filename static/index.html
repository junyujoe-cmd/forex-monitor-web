<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时外汇监控系统</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--page:#070c11;--panel:#0c1720;--raised:#101e28;--line:#20313b;--soft:#172730;--text:#e3ecee;--muted:#82949b;--timestamp:#60757e;--accent:#57d9b5;--bid:#59d9b6;--ask:#ff8178;--market:#e7bd66;--danger:#ff8178}
html,body{min-height:100%;background:var(--page);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;overflow-x:hidden}
button,select,input{font:inherit}
button{cursor:pointer}
.app-shell{width:min(100%,1460px);min-height:100dvh;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.topbar{height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 13px;border:1px solid var(--line);border-bottom-color:var(--accent);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px}.brand-mark{width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(87,217,181,.55);color:var(--accent);font:800 9px ui-monospace,monospace}.brand h1{font-size:13px;letter-spacing:.02em}.brand p{margin-top:2px;color:var(--muted);font-size:7px;letter-spacing:.15em}
.view-nav{height:100%;display:flex;align-items:stretch}.nav-button{min-width:78px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:10px;font-weight:700}.nav-button.active{border-bottom-color:var(--accent);background:rgba(87,217,181,.06);color:var(--accent)}
.status{justify-self:end;text-align:right}.live{color:var(--accent);font-size:9px}.live::before{content:"";display:inline-block;width:5px;height:5px;margin-right:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent)}.updated{margin-top:3px;color:var(--timestamp);font-size:8px;font-variant-numeric:tabular-nums}
.panel{border:1px solid var(--line);background:var(--panel)}.view-panel{display:none}.view-panel.active{display:block}
.matrix-scroll{overflow:auto}.quote-grid{display:grid;grid-template-columns:126px 116px repeat(8,minmax(118px,1fr));min-width:1186px}
.grid-head{height:42px;padding:7px 10px;border-right:1px solid var(--soft);border-bottom:1px solid var(--line);color:var(--muted);font-size:8px;display:flex;flex-direction:column;justify-content:center}.grid-head strong{color:var(--text);font-size:9px}.grid-head span{margin-top:3px;color:var(--timestamp);font-size:7px}.grid-head.source{text-align:center;align-items:center}
.pair-cell,.market-cell,.quote-cell{position:relative;height:92px;border-right:1px solid var(--soft);border-bottom:1px solid var(--line)}
.pair-cell{padding:19px 12px}.pair-code{font:800 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.04em}.pair-name{margin-top:7px;color:var(--muted);font-size:8px}
.market-cell{padding:19px 10px;text-align:left}
.quote-cell{width:100%;padding:19px 10px;border-top:0;border-left:0;background:transparent;color:var(--text);text-align:left}.quote-cell:hover,.quote-cell.selected{background:rgba(87,217,181,.045);box-shadow:inset 0 0 0 1px rgba(87,217,181,.28)}
.quote-line{display:grid;grid-template-columns:14px 1fr;align-items:baseline;margin-bottom:8px}.quote-side{color:var(--timestamp);font-size:7px}.quote-value{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}.quote-line.bid .quote-value{color:var(--bid)}.quote-line.ask .quote-value{color:var(--ask)}
.market-cell .quote-line .quote-value{color:var(--market)}
.quote-timestamp{color:var(--timestamp);font:600 7px ui-monospace,SFMono-Regular,Menlo,monospace;position:absolute;right:7px;bottom:6px;font-variant-numeric:tabular-nums}.empty-price{color:var(--timestamp)}
.entry-bar{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(170px,.58fr) minmax(190px,.68fr);min-height:93px;border:1px solid var(--line);background:var(--panel)}
.entry-form{padding:10px 11px;border-right:1px solid var(--line)}.entry-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:10px}.entry-title strong{font-size:11px}.active-pair{color:var(--accent);font:700 9px ui-monospace,monospace}
.entry-fields{display:grid;grid-template-columns:105px 135px minmax(185px,1fr) 128px 94px 88px;gap:5px}.control{height:32px;padding:0 8px;border:1px solid var(--line);border-radius:0;background:#081119;color:var(--text);font-size:9px;outline:0}.control:focus{border-color:var(--accent)}.price-input{font:700 12px ui-monospace,monospace}.submit{border:1px solid var(--accent);background:var(--accent);color:#06110e;font-size:9px;font-weight:800}.submit:hover{background:#74e5c5}.submit:disabled{opacity:.5;cursor:wait}
.target-fields{grid-template-columns:105px 135px minmax(185px,1fr) 150px 110px}.historical-control{display:none}.historical-control.visible{display:block;grid-column:4/6;grid-row:2}.entry-help{margin-top:7px;color:var(--timestamp);font-size:7px}.entry-error{color:var(--danger)}
.result-box{display:flex;flex-direction:column;justify-content:center;padding:10px 12px;border-right:1px solid var(--line)}.result-label{color:var(--muted);font-size:8px;line-height:1.45}.result-value{margin-top:3px;color:var(--accent);font:800 21px ui-monospace,monospace}.result-value.negative{color:var(--ask)}.result-unit{font-size:7px;margin-left:4px;color:var(--muted)}
.recent-strip{grid-column:1/-1;display:flex;height:29px;align-items:center;gap:18px;padding:0 11px;border-top:1px solid var(--line);overflow:hidden;white-space:nowrap;color:var(--muted);font-size:7px}.recent-title{color:var(--timestamp)}.recent-item strong{color:var(--text);font-weight:650}.recent-item span{margin-left:6px}
.history-shell{min-height:470px;padding:10px}.history-toolbar{display:grid;grid-template-columns:140px auto minmax(300px,1fr);gap:8px;align-items:end;padding:0 0 10px}.field label,.source-label{display:block;margin-bottom:5px;color:var(--muted);font-size:8px}.field .control{width:100%}.range-buttons{display:flex}.range-button{height:32px;padding:0 11px;border:1px solid var(--line);border-right:0;background:#081119;color:var(--muted);font-size:8px}.range-button:last-child{border-right:1px solid var(--line)}.range-button.active{border-color:var(--accent);background:rgba(87,217,181,.08);color:var(--accent)}
.source-options{display:flex;align-items:center;gap:11px;min-height:32px;overflow-x:auto;white-space:nowrap}.source-option{color:var(--muted);font-size:8px}.source-option input{margin-right:4px;accent-color:var(--accent)}.source-option.locked{color:var(--market)}
.custom-range{display:none;grid-column:1/-1;grid-template-columns:200px 200px;gap:8px}.custom-range.visible{display:grid}
.chart-wrap{position:relative;height:395px;border:1px solid var(--soft);background:#09131b}#historyChart{width:100%;height:100%}.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:10px;pointer-events:none}.history-note{margin-top:7px;color:var(--timestamp);font-size:8px}
.loading{min-height:410px;display:grid;place-items:center;color:var(--muted);font-size:10px;grid-column:1/-1}.hidden{display:none!important}
@media(max-width:900px){.topbar{grid-template-columns:1fr auto}.view-nav{grid-row:2;grid-column:1/-1;height:35px}.topbar{height:82px}.status{grid-column:2;grid-row:1}.entry-bar{grid-template-columns:1fr 1fr}.entry-form{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}.entry-fields{grid-template-columns:repeat(3,1fr)}.history-toolbar{grid-template-columns:1fr 1fr}.source-options{grid-column:1/-1}.custom-range{grid-column:1/-1}.recent-strip{overflow-x:auto}}
</style>
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">FX</div><div><h1>外汇报价工作台</h1><p>FOREIGN EXCHANGE MONITOR</p></div></div>
    <nav class="view-nav" aria-label="视图切换">
      <button class="nav-button active" id="viewLive" type="button">实时总览</button>
      <button class="nav-button" id="viewHistory" type="button">历史图表</button>
    </nav>
    <div class="status"><div class="live">实时采集中</div><div class="updated" id="updateTime">最后更新 --</div></div>
  </header>

  <section class="panel view-panel active" id="liveView">
    <div class="matrix-scroll"><div class="quote-grid" id="quoteMatrix"><div class="loading">正在载入实时报价</div></div></div>
  </section>

  <section class="panel view-panel" id="historyView">
    <div class="history-shell">
      <div class="history-toolbar">
        <div class="field"><label for="historyPair">货币对</label><select class="control" id="historyPair"></select></div>
        <div><span class="source-label">时间范围</span><div class="range-buttons"><button class="range-button active" data-hours="today">当天数据</button><button class="range-button" data-hours="168">7天</button><button class="range-button" data-hours="720">30天</button><button class="range-button" data-hours="custom">自定义</button></div></div>
        <div><span class="source-label">对比银行（最多选择两家，同时显示买入价和卖出价）</span><div class="source-options" id="historySources"></div></div>
        <div class="custom-range" id="customRange"><div class="field"><label for="historyStart">开始时间</label><input class="control" id="historyStart" type="datetime-local"></div><div class="field"><label for="historyEnd">结束时间</label><input class="control" id="historyEnd" type="datetime-local"></div></div>
      </div>
      <div class="chart-wrap"><div id="historyChart"></div><div class="chart-empty" id="chartEmpty">正在读取历史数据</div></div>
      <div class="history-note">点击图表中的任意折线位置，会自动切换为历史录入并带入该时间。</div>
    </div>
  </section>

  <section class="entry-bar" id="entryBar">
    <form class="entry-form" id="entryForm">
      <div class="entry-title"><strong>客户报价录入</strong><span class="active-pair" id="activePairLabel">USD/CNY</span></div>
      <div class="entry-fields">
        <select class="control" id="entryPair" aria-label="货币对"></select>
        <select class="control" id="entryBank" aria-label="银行"></select>
        <select class="control" id="entryDirection" aria-label="方向"><option value="买入价">银行买入（客户卖出）</option><option value="卖出价">银行卖出（客户买入）</option></select>
        <input class="control price-input" id="entryQuote" type="number" step="0.0001" placeholder="输入客户报价" required>
        <select class="control" id="entryMode" aria-label="时间模式"><option value="current">当前</option><option value="historical">历史</option></select>
        <button class="submit" id="entrySubmit" type="submit">计算并保存</button>
        <input class="control historical-control" id="entryDateTime" type="datetime-local" aria-label="历史时间">
      </div>
      <div class="entry-help" id="entryHelp">点击上方任意银行报价，可自动带入货币对和银行。</div>
    </form>
    <div class="result-box"><div class="result-label" id="marketResultLabel">对比市场成本，你赚</div><div class="result-value" id="marketResult">--<span class="result-unit">bp</span></div></div>
    <div class="result-box"><div class="result-label" id="bankResultLabel">对比中国银行牌价，优惠</div><div class="result-value" id="bankResult">--<span class="result-unit">bp</span></div></div>
    <div class="recent-strip" id="recentEntries"><span class="recent-title">最近录入</span><span>暂无记录</span></div>
  </section>

  <section class="entry-bar" id="targetBar">
    <form class="entry-form" id="targetForm">
      <div class="entry-title"><strong>拟定赚取点数</strong></div>
      <div class="entry-fields target-fields">
        <select class="control" id="targetPair" aria-label="货币对"></select>
        <select class="control" id="targetBank" aria-label="银行"></select>
        <select class="control" id="targetDirection" aria-label="方向"><option value="买入价">银行买入（客户卖出）</option><option value="卖出价">银行卖出（客户买入）</option></select>
        <input class="control price-input" id="targetBp" type="number" step="any" placeholder="赚取点数，如 100" required>
        <button class="submit" type="submit">计算应报价</button>
      </div>
      <div class="entry-help" id="targetHelp">以 CFETS 对应买卖价为基准，加减赚取点数，得出银行应报价。</div>
    </form>
    <div class="result-box"><div class="result-label">银行应报价</div><div class="result-value" id="targetPrice">--</div></div>
    <div class="result-box"><div class="result-label" id="targetBankLabel">对比银行牌价，优惠</div><div class="result-value" id="targetBpResult">--<span class="result-unit">bp</span></div></div>
  </section>
</main>

<script>
const PAIRS = ["USDCNY", "EURCNY", "HKDCNY", "JPYCNY"];
const BANKS = ["中国银行", "招商银行", "建设银行", "杭州银行", "工商银行", "农业银行", "邮储银行", "民生银行"];
const PAIR_NAMES = {USDCNY:"美元兑人民币",EURCNY:"欧元兑人民币",HKDCNY:"港币兑人民币",JPYCNY:"日元兑人民币"};
const HISTORY_COLORS = {market:"#e7bd66",firstBid:"#57d9b5",firstAsk:"#ff8178",secondBid:"#b7e35f",secondAsk:"#f59ac3"};
let quoteData = {cfets:{},banks:{},timestamp:""};
let selectedCell = null;
let activeHistoryHours = "today";
let historyChart = null;

const byId = id => document.getElementById(id);
const safe = value => String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
const pairLabel = pair => pair.slice(0,3) + "/" + pair.slice(3);
const price = value => Number.isFinite(Number(value)) ? Number(value).toFixed(4) : "--";
function timeLabel(value){
  if(!value) return "--:--";
  const match = String(value).match(/(?:T|\s)(\d{2}:\d{2})/);
  return match ? match[1] : "--:--";
}
function localDateTime(value){
  const date = new Date(value);
  const pad = number => String(number).padStart(2,"0");
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
function tradingSessionRange(days=1,now=new Date()){
  const sessionStart = new Date(now);
  const beforeOpen = now.getHours() < 9 || (now.getHours() === 9 && now.getMinutes() < 30);
  if(beforeOpen) sessionStart.setDate(sessionStart.getDate()-1);
  sessionStart.setHours(9,30,0,0);
  const sessionEnd = new Date(sessionStart);
  sessionEnd.setDate(sessionEnd.getDate()+1);
  sessionEnd.setHours(2,59,0,0);
  const end = now < sessionEnd ? now : sessionEnd;
  sessionStart.setDate(sessionStart.getDate()-(days-1));
  return {start:localDateTime(sessionStart),end:localDateTime(end)};
}
function quoteTime(quote){return timeLabel(quote?.source_time || quote?.timestamp || quote?.fetch_time || quoteData.timestamp)}

function populateControls(){
  const pairOptions = PAIRS.map(pair => `<option value="${pair}">${pairLabel(pair)}</option>`).join("");
  byId("entryPair").innerHTML = pairOptions;
  byId("historyPair").innerHTML = pairOptions;
  byId("entryBank").innerHTML = BANKS.map(bank => `<option>${bank}</option>`).join("");
  byId("targetPair").innerHTML = pairOptions;
  byId("targetBank").innerHTML = byId("entryBank").innerHTML;
  const defaultBanks = new Set(["中国银行"]);
  byId("historySources").innerHTML = `<label class="source-option locked"><input type="checkbox" checked disabled>CFETS</label>` + BANKS.map(bank => `<label class="source-option"><input type="checkbox" value="${bank}" ${defaultBanks.has(bank) ? "checked" : ""}>${bank}</label>`).join("");
}

function renderMatrix(){
  const head = [`<div class="grid-head"><strong>货币对</strong><span>PAIR</span></div>`,`<div class="grid-head source"><strong>CFETS</strong><span>买入 / 卖出</span></div>`]
    .concat(BANKS.map(bank => `<div class="grid-head source"><strong>${bank}</strong><span>买入 / 卖出</span></div>`));
  const rows = PAIRS.flatMap(pair => {
    const market = quoteData.cfets?.[pair] || {};
    const cells = [
      `<div class="pair-cell"><div class="pair-code">${pairLabel(pair)}</div><div class="pair-name">${PAIR_NAMES[pair]}</div></div>`,
      `<div class="market-cell"><div class="quote-line bid"><span class="quote-side">买</span><span class="quote-value">${price(market.bid)}</span></div><div class="quote-line ask"><span class="quote-side">卖</span><span class="quote-value">${price(market.ask)}</span></div><span class="quote-timestamp">${quoteTime(market)}</span></div>`
    ];
    BANKS.forEach(bank => {
      const quote = quoteData.banks?.[bank]?.[pair] || {};
      const isSelected = selectedCell === `${pair}|${bank}`;
      cells.push(`<button class="quote-cell${isSelected ? " selected" : ""}" type="button" data-pair="${pair}" data-bank="${bank}" aria-label="${bank} ${pairLabel(pair)}，买入 ${price(quote.bid)}，卖出 ${price(quote.ask)}"><span class="quote-line bid"><span class="quote-side">买</span><span class="quote-value${quote.bid == null ? " empty-price" : ""}">${price(quote.bid)}</span></span><span class="quote-line ask"><span class="quote-side">卖</span><span class="quote-value${quote.ask == null ? " empty-price" : ""}">${price(quote.ask)}</span></span><span class="quote-timestamp">${quoteTime(quote)}</span></button>`);
    });
    return cells;
  });
  byId("quoteMatrix").innerHTML = head.concat(rows).join("");
  byId("quoteMatrix").querySelectorAll(".quote-cell").forEach(cell => cell.addEventListener("click", () => selectQuote(cell.dataset.pair, cell.dataset.bank)));
}

function selectQuote(pair,bank){
  selectedCell = `${pair}|${bank}`;
  byId("entryPair").value = pair;
  byId("entryBank").value = bank;
  updateEntryLabels();
  renderMatrix();
  byId("entryQuote").focus();
}
function updateEntryLabels(){
  byId("activePairLabel").textContent = pairLabel(byId("entryPair").value);
  byId("bankResultLabel").textContent = `对比${byId("entryBank").value}牌价，优惠`;
}
function setEntryTimeMode(mode){
  byId("entryMode").value = mode;
  const historical = mode === "historical";
  byId("entryDateTime").classList.toggle("visible",historical);
  if(historical && !byId("entryDateTime").value) byId("entryDateTime").value = localDateTime(new Date());
  byId("entryHelp").textContent = historical ? "历史计算只使用所选时间之前最近的市场价和银行牌价。" : "点击上方任意银行报价，可自动带入货币对和银行。";
}

async function fetchQuotes(){
  try{
    const response = await fetch("/api/quotes",{cache:"no-store"});
    if(!response.ok) throw new Error("报价接口异常");
    quoteData = await response.json();
    byId("updateTime").textContent = `最后更新 ${quoteData.timestamp || "--"}`;
    renderMatrix();
  }catch(error){
    byId("quoteMatrix").innerHTML = `<div class="loading entry-error">暂时无法读取报价，请稍后重试</div>`;
  }
}

function signedBp(value){
  const number = Number(value);
  if(!Number.isFinite(number)) return "--";
  return `${number > 0 ? "+" : ""}${number.toFixed(1)}`;
}
function setResult(element,value){
  const number = Number(value);
  element.classList.toggle("negative",number < 0);
  element.innerHTML = `${signedBp(value)}<span class="result-unit">bp</span>`;
}
function resultTime(value){return value === "当前实时" ? "" : timeLabel(value)}
function renderEntryResult(data){
  const bank = byId("entryBank").value;
  const marketTime = resultTime(data.market_compare_time);
  const bankTime = resultTime(data.bank_compare_time);
  byId("marketResultLabel").textContent = marketTime ? `对比当时市场成本（${marketTime}），你赚` : "对比市场成本，你赚";
  byId("bankResultLabel").textContent = bankTime ? `对比当时${bank}牌价（${bankTime}），优惠` : `对比${bank}牌价，优惠`;
  setResult(byId("marketResult"),data.bp_vs_market);
  setResult(byId("bankResult"),data.bp_vs_bank_price);
  if(marketTime || bankTime) byId("entryHelp").textContent = `实际采用：CFETS ${marketTime || "无数据"}，${bank} ${bankTime || "无数据"}`;
}
async function submitEntry(event){
  event.preventDefault();
  const quote = byId("entryQuote").value;
  if(!quote) return;
  const params = new URLSearchParams({pair:byId("entryPair").value,bank:byId("entryBank").value,direction:byId("entryDirection").value,quote});
  if(byId("entryMode").value === "historical"){
    if(!byId("entryDateTime").value){byId("entryHelp").textContent = "请先选择历史日期和时间。";return}
    params.set("time",byId("entryDateTime").value);
  }
  byId("entrySubmit").disabled = true;
  try{
    const response = await fetch(`/api/entry?${params}`,{method:"POST"});
    const data = await response.json();
    if(!data.ok){byId("entryHelp").textContent = data.error || "计算失败";byId("entryHelp").classList.add("entry-error");return}
    byId("entryHelp").classList.remove("entry-error");
    renderEntryResult(data);
    await loadEntries();
  }catch(error){byId("entryHelp").textContent = "提交失败，请检查本地服务。";byId("entryHelp").classList.add("entry-error")}
  finally{byId("entrySubmit").disabled = false}
}
async function submitTarget(event){
  event.preventDefault();
  const bank = byId("targetBank").value;
  const params = new URLSearchParams({pair:byId("targetPair").value,bank,direction:byId("targetDirection").value,target_bp:byId("targetBp").value});
  try{
    const response = await fetch(`/api/target_quote?${params}`);
    const data = await response.json();
    if(!data.ok){byId("targetHelp").textContent = data.error || "计算失败";byId("targetHelp").classList.add("entry-error");return}
    byId("targetHelp").classList.remove("entry-error");
    byId("targetPrice").textContent = data.target_price.toFixed(4);
    byId("targetBankLabel").textContent = `对比${bank}牌价，优惠`;
    setResult(byId("targetBpResult"),data.bp_vs_bank_price);
  }catch(error){byId("targetHelp").textContent = "计算失败，请检查本地服务。";byId("targetHelp").classList.add("entry-error")}
}
async function loadEntries(){
  try{
    const data = await fetch("/api/entries?limit=6",{cache:"no-store"}).then(response => response.json());
    const items = (data.entries || []).slice().reverse();
    byId("recentEntries").innerHTML = `<span class="recent-title">最近录入</span>` + (items.length ? items.map(item => `<span class="recent-item"><strong>${safe(pairLabel(item.pair))}　${safe(item.bank)}</strong><span>${safe(item.quote)}　${signedBp(item.bp_vs_market)}bp</span></span>`).join("") : "<span>暂无记录</span>");
  }catch(error){}
}

function selectedHistoryBanks(){return [...byId("historySources").querySelectorAll('input:not(:disabled):checked')].map(input => input.value)}
function historyQuery(){
  const params = new URLSearchParams({pair:byId("historyPair").value,banks:selectedHistoryBanks().join(",")});
  if(activeHistoryHours === "custom"){params.set("start",byId("historyStart").value);params.set("end",byId("historyEnd").value)}
  else {const days=activeHistoryHours === "168" ? 7 : activeHistoryHours === "720" ? 30 : 1;const range=tradingSessionRange(days);params.set("start",range.start);params.set("end",range.end)}
  return params;
}
async function loadHistory(){
  byId("chartEmpty").textContent = "正在读取历史数据";
  byId("chartEmpty").classList.remove("hidden");
  try{
    const data = await fetch(`/api/history?${historyQuery()}`,{cache:"no-store"}).then(response => response.json());
    if(!data.ok) throw new Error(data.error || "历史数据读取失败");
    renderHistory(data);
  }catch(error){byId("chartEmpty").textContent = error.message || "历史数据读取失败"}
}
function normalizeHistoryPoints(points){
  const minutes = new Map();
  (points || []).forEach(([timestamp,value]) => {
    minutes.set(`${String(timestamp).slice(0,16)}:00`,value);
  });
  return [...minutes.entries()];
}
function renderHistory(data){
  if(!historyChart) historyChart = echarts.init(byId("historyChart"));
  const dailyAxis = activeHistoryHours !== "today";
  const axisStep = 30*60*1000;
  const axisLabel = value => {const date=new Date(value);const pad=number=>String(number).padStart(2,"0");return dailyAxis ? `${date.getMonth()+1}.${pad(date.getDate())}` : `${pad(date.getHours())}:${pad(date.getMinutes())}`};
  const showAxisLabel = (index,value) => {const date=new Date(value);return dailyAxis ? date.getHours() === 9 && date.getMinutes() === 30 : value === axisData[axisData.length-1] || date.getMinutes() % 30 === 0};
  const series = [{name:"CFETS 中间价",type:"line",showSymbol:false,symbolSize:1,data:normalizeHistoryPoints(data.market),lineStyle:{width:0.8,color:HISTORY_COLORS.market},itemStyle:{color:HISTORY_COLORS.market},emphasis:{scale:3,lineStyle:{width:0.8}}}];
  Object.entries(data.banks || {}).forEach(([bank,bankData],index) => {
    const bidColor = index === 0 ? HISTORY_COLORS.firstBid : HISTORY_COLORS.secondBid;
    const askColor = index === 0 ? HISTORY_COLORS.firstAsk : HISTORY_COLORS.secondAsk;
    series.push(
      {name:`${bank} 买入价`,type:"line",showSymbol:false,symbolSize:1,data:normalizeHistoryPoints(bankData.bid),lineStyle:{width:0.7,color:bidColor},itemStyle:{color:bidColor},emphasis:{scale:3,lineStyle:{width:0.7}}},
      {name:`${bank} 卖出价`,type:"line",showSymbol:false,symbolSize:1,data:normalizeHistoryPoints(bankData.ask),lineStyle:{width:0.7,color:askColor},itemStyle:{color:askColor},emphasis:{scale:3,lineStyle:{width:0.7}}},
    );
  });
  const axisTimes = [data.start];
  const rangeStart = new Date(data.start);
  const rangeEnd = new Date(data.end);
  const displayEnd = new Date(rangeEnd);
  if(activeHistoryHours === "today"){displayEnd.setTime(rangeStart.getTime());displayEnd.setDate(displayEnd.getDate()+1);displayEnd.setHours(2,59,0,0)}
  const axisCursor = new Date(rangeStart);
  axisCursor.setSeconds(0,0);
  if(axisCursor.getMinutes() !== 0 && axisCursor.getMinutes() !== 30){axisCursor.setMinutes(axisCursor.getMinutes() < 30 ? 30 : 60)}
  while(axisCursor <= displayEnd){axisTimes.push(`${localDateTime(axisCursor)}:00`);axisCursor.setTime(axisCursor.getTime()+axisStep)}
  axisTimes.push(localDateTime(displayEnd));
  const axisData = [...new Set(axisTimes)].sort();
  const hasData = series.some(item => item.data.length);
  byId("chartEmpty").classList.toggle("hidden",hasData);
  if(!hasData) byId("chartEmpty").textContent = "这个时间范围内暂无历史数据";
  historyChart.off("click");
  historyChart.setOption({animation:false,backgroundColor:"transparent",legend:{top:11,textStyle:{color:"#82949b",fontSize:9}},grid:{left:62,right:24,top:48,bottom:42},tooltip:{trigger:"axis",axisPointer:{type:"line",snap:true},backgroundColor:"#101e28",borderColor:"#20313b",textStyle:{color:"#e3ecee",fontSize:10}},xAxis:[{type:"time",min:data.start,max:displayEnd,boundaryGap:false,axisLine:{show:false},axisTick:{show:false},axisLabel:{show:false},splitLine:{show:false}},{type:"category",position:"bottom",offset:0,data:axisData,boundaryGap:false,axisPointer:{show:false},axisLine:{lineStyle:{color:"#20313b"}},axisLabel:{color:"#60757e",fontSize:8,hideOverlap:false,interval:showAxisLabel,formatter:axisLabel},splitLine:{show:false}}],yAxis:{type:"value",scale:true,axisLabel:{color:"#60757e",fontSize:8},splitLine:{lineStyle:{color:"#172730"}}},series},true);
  historyChart.on("click",handleChartPoint);
}
function handleChartPoint(params){
  const value = Array.isArray(params.value) ? params.value[0] : params.value;
  if(!value) return;
  byId("entryPair").value = byId("historyPair").value;
  const selectedBank = BANKS.find(bank => params.seriesName.startsWith(`${bank} `));
  if(selectedBank) byId("entryBank").value = selectedBank;
  byId("entryDateTime").value = localDateTime(value);
  setEntryTimeMode('historical');
  updateEntryLabels();
  byId("entryQuote").focus();
}

function switchView(name){
  const history = name === "history";
  byId("liveView").classList.toggle("active",!history);byId("historyView").classList.toggle("active",history);
  byId("viewLive").classList.toggle("active",!history);byId("viewHistory").classList.toggle("active",history);
  if(history){loadHistory();setTimeout(() => historyChart?.resize(),50)}
}
function bindEvents(){
  byId("viewLive").addEventListener("click",() => switchView("live"));byId("viewHistory").addEventListener("click",() => switchView("history"));
  byId("entryPair").addEventListener("change",updateEntryLabels);byId("entryBank").addEventListener("change",updateEntryLabels);byId("entryMode").addEventListener("change",event => setEntryTimeMode(event.target.value));byId("entryForm").addEventListener("submit",submitEntry);byId("targetForm").addEventListener("submit",submitTarget);
  byId("historyPair").addEventListener("change",loadHistory);
  byId("historySources").addEventListener("change",event => {const checked = selectedHistoryBanks();if(checked.length > 2){event.target.checked=false;return}loadHistory()});
  document.querySelectorAll(".range-button").forEach(button => button.addEventListener("click",() => {activeHistoryHours=button.dataset.hours;document.querySelectorAll(".range-button").forEach(item => item.classList.toggle("active",item===button));byId("customRange").classList.toggle("visible",activeHistoryHours==="custom");if(activeHistoryHours!=="custom") loadHistory()}));
  byId("historyStart").addEventListener("change",loadHistory);byId("historyEnd").addEventListener("change",loadHistory);window.addEventListener("resize",() => historyChart?.resize());
}

populateControls();bindEvents();updateEntryLabels();fetchQuotes();loadEntries();
setInterval(fetchQuotes,15000);
</script>
