<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>实时外汇监控系统</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--page:#070b10;--panel:#0e1620;--panel-raised:#131e29;--line:#20303d;--line-soft:#182630;--text:#dce5e8;--muted:#7f9098;--accent:#56d8b3;--bid:#56d8b3;--ask:#ff857a;--warn:#d8a84e;--danger:#e77770}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--page);color:var(--text);min-height:100vh;overflow-x:hidden}
.app-shell{width:min(calc(100% - 32px),1400px);max-width:1400px;margin:0 auto;padding:18px 0 28px}

/* ── Header ── */
.terminal-header{min-height:76px;padding:15px 18px;border:1px solid var(--line);border-bottom-color:var(--accent);background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:18px}
.terminal-brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{width:42px;height:42px;border:1px solid rgba(86,216,179,.58);background:rgba(86,216,179,.08);color:var(--accent);display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:.08em}
.brand-copy h1{font-size:18px;line-height:1.25;color:var(--text);font-weight:650;letter-spacing:.02em}
.brand-copy p{margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.18em}
.terminal-state{display:flex;align-items:flex-end;flex-direction:column;gap:6px;white-space:nowrap}
.live-status{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:12px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(86,216,179,.09)}
.update-time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── Panels ── */
.panel{background:var(--panel);border:1px solid var(--line)}

/* ── Focused Quote Board ── */
.market-panel{margin-top:8px;background:rgba(14,22,32,.96);border:1px solid var(--line)}
.market-head{min-height:45px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line-soft)}
.pair-tabs{display:flex;gap:3px}
.pair-tab{appearance:none;padding:7px 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer}
.pair-tab.active{color:var(--text);border-bottom-color:var(--accent);background:#12211f}
.market-reference{display:flex;align-items:baseline;gap:8px;color:var(--muted);font-size:9px}
.market-reference strong{color:var(--text);font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.market-reference small{color:var(--muted)}
.bank-quote-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.bank-quote{min-height:67px;padding:10px 11px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.bank-quote:nth-child(4n){border-right:0}
.bank-quote:nth-child(n+5){border-bottom:0}
.bank-quote-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--text);font-size:11px;font-weight:650}
.bank-quote-head small{color:var(--muted);font-size:9px;font-weight:500;font-variant-numeric:tabular-nums}
.bank-price-line,.bank-price-labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:right}
.bank-price-line{margin-top:7px;font:650 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
.bank-price-line .buy{color:var(--bid)}
.bank-price-line .sell{color:var(--ask)}
.bank-price-labels{margin-top:2px;color:var(--muted);font-size:8px}
.quote-status{text-align:center;color:var(--muted);font-size:9px;line-height:1.35}
.quote-status.ok{color:var(--accent)}
.quote-status.partial{color:var(--warn)}
.quote-status.missing{color:var(--danger)}

/* ── Quote Workspace ── */
.workspace-panel{margin-top:12px;overflow:hidden}
.workspace-tabs{display:flex;align-items:center;gap:2px;padding:0 14px;background:var(--panel-raised);border-bottom:1px solid var(--line)}
.tab-btn{appearance:none;min-width:120px;padding:14px 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:650;letter-spacing:.03em;cursor:pointer;transition:color .14s ease,background-color .14s ease,border-color .14s ease}
.tab-btn:hover{color:var(--text);background:rgba(220,229,232,.03)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(86,216,179,.055)}
.tab-content{padding:16px;min-height:330px}
.tab-pane{display:none}
.tab-pane.active{display:block}
.workbench{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:14px}
.deal-ticket,.result-summary{padding:16px;border:1px solid var(--line-soft);background:var(--panel-raised)}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-heading span{color:var(--accent);font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace}
.section-kicker{display:block;margin-bottom:6px;color:var(--muted);font-size:9px;line-height:1.2;letter-spacing:.17em}
.deal-ticket h2,.chart-heading h2{color:var(--text);font-size:14px;font-weight:650}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.ticket-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px;align-items:end}
.field{display:flex;min-width:0;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.field select,.field input{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--page);color:var(--text);font:inherit;font-size:13px;outline:none}
.field select:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(86,216,179,.08)}
.field input::placeholder{color:var(--muted)}
:is(button,select,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;min-height:38px;padding:8px 17px;border:1px solid var(--accent);border-radius:2px;background:var(--accent);color:var(--page);font:inherit;font-size:12px;font-weight:750;cursor:pointer;transition:background-color .14s ease,color .14s ease}
.btn:hover{background:#70e2c1}
.time-mode{display:flex;gap:6px}
.time-mode button{min-height:38px;padding:8px 12px;border:1px solid var(--line);background:var(--page);color:var(--muted);cursor:pointer}
.time-mode button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.historical-time-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.historical-time-fields[hidden]{display:none}
.ticket-submit{justify-self:end}
.entry-context{grid-column:1/-1;margin-top:12px;color:var(--muted);font-size:10px}
.result-summary{display:grid;align-content:center;gap:10px;min-height:120px;color:var(--muted)}
.result-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.result-row:last-child{border-bottom:0}
.result-row.positive .result-value{color:var(--bid)}
.result-row.negative .result-value{color:var(--ask)}
.result-row.neutral .result-value{color:var(--muted)}
.result-value{font-weight:700;font-variant-numeric:tabular-nums}
.recent-activity{display:flex;gap:18px;margin-top:12px;padding:12px 16px;overflow-x:auto;border:1px solid var(--line-soft);background:var(--panel-raised);color:var(--muted);font-size:11px}
.recent-entry{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.recent-entry:first-child{padding-top:0}
.recent-entry:last-child{border-bottom:0}
.recent-entry-main{color:var(--text);font-size:12px;font-weight:650}
.recent-entry-meta{margin-top:4px;color:var(--muted);font-size:10px;line-height:1.5;font-variant-numeric:tabular-nums}
.inline-state{display:grid;min-height:112px;place-items:center;padding:20px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.inline-error{color:var(--danger);border:1px solid rgba(231,119,112,.28);background:rgba(231,119,112,.045)}
.skeleton-quote{pointer-events:none}
.skeleton-line{display:inline-block;width:58px;height:8px;border-radius:1px;background:var(--line);vertical-align:middle}
.skeleton-line+.skeleton-line{margin-left:10px;width:48px;background:var(--line-soft)}

/* ── Chart ── */
.chart-heading{margin-bottom:14px}
.chart-controls{grid-template-columns:160px minmax(220px,320px) 170px;gap:12px;align-items:end;margin:0 0 14px}
#chart{width:100%;height:440px;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}

/* ── Loading ── */
.loading{text-align:center;padding:40px;color:#666;font-size:14px}

/* ── Responsive ── */
@media(max-width:860px){
  .workbench{grid-template-columns:1fr}
  .ticket-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-controls{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:640px){
  .app-shell{width:calc(100% - 16px);margin:12px auto 24px;padding:0}
  .terminal-header{align-items:flex-start;flex-direction:column}
  .live-meta{width:100%;align-items:center;flex-direction:row;justify-content:space-between}
  .tab-content{padding:10px}
  .workbench{grid-template-columns:1fr}
  .deal-ticket,.result-summary{padding:14px}
  .ticket-fields{grid-template-columns:1fr}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .chart-controls{grid-template-columns:1fr}
  #chart{height:330px}
}
</style>
</head>
<body>
<main class="app-shell">

<!-- Header -->
<header class="terminal-header">
  <div class="terminal-brand">
    <div class="brand-mark" aria-hidden="true">FX</div>
    <div class="brand-copy">
      <h1>外汇报价工作台</h1>
      <p>FOREIGN EXCHANGE MONITOR</p>
    </div>
  </div>
  <div class="terminal-state live-meta">
    <div class="live-status"><span class="status-dot" aria-hidden="true"></span><span>实时采集中</span></div>
    <span class="update-time" id="updateTime">最后更新 --</span>
  </div>
</header>

<!-- Quotes -->
<section class="panel market-panel" aria-labelledby="quotePanelTitle">
  <h2 id="quotePanelTitle" hidden>实时银行报价</h2>
  <div class="market-head">
    <div class="pair-tabs" id="pairTabs" role="tablist" aria-label="货币对"></div>
    <div class="market-reference" id="marketReference" role="status" aria-live="polite">
      <span>CFETS 市场参考</span>
      <strong id="marketReferenceValue">--</strong>
      <small id="marketReferenceState">等待数据</small>
    </div>
  </div>
  <div class="quotes" id="quotesContainer" aria-labelledby="quotePanelTitle"></div>
</section>

<!-- Quote Entry Workspace -->
<section class="panel workspace-panel">
  <nav class="workspace-tabs" role="tablist" aria-label="报价工作区">
    <button class="tab-btn active" id="entryTab" type="button" role="tab" aria-selected="true" aria-controls="tab-entry" data-tab="entry">录入报价</button>
    <button class="tab-btn" id="chartTab" type="button" role="tab" aria-selected="false" aria-controls="tab-chart" data-tab="chart">历史图表</button>
  </nav>

  <div class="tab-content">
    <div class="tab-pane active" id="tab-entry" role="tabpanel" aria-labelledby="entryTab">
      <input type="hidden" id="entryPair" value="USDCNY">
      <div class="workbench">
        <section class="deal-ticket" aria-labelledby="entryPanelTitle">
          <div class="section-heading">
            <h2 id="entryPanelTitle">客户报价录入</h2>
            <span id="activeEntryPair">USDCNY</span>
          </div>
          <div class="ticket-fields">
            <label class="field">银行
              <select id="entryBank">
                <option>中国银行</option><option>招商银行</option>
                <option>建设银行</option><option>杭州银行</option>
                <option>工商银行</option><option>农业银行</option>
                <option>邮储银行</option><option>民生银行</option>
              </select>
            </label>
            <label class="field">方向
              <select id="entryDir">
                <option value="买入价">银行买入（客户卖出）</option>
                <option value="卖出价">银行卖出（客户买入）</option>
              </select>
            </label>
            <label class="field">客户报价
              <input type="number" id="entryQuote" step="0.0001" inputmode="decimal" placeholder="7.2400">
            </label>
            <div class="time-mode" role="group" aria-label="报价时间模式">
              <button type="button" id="entryTimeCurrent" aria-pressed="true">当前</button>
              <button type="button" id="entryTimeHistorical" aria-pressed="false">历史</button>
            </div>
            <div class="historical-time-fields" id="historicalTimeFields" hidden>
              <label class="field">日期<input type="date" id="entryDate"></label>
              <label class="field">时间<input type="time" id="entryTime"></label>
            </div>
            <button type="button" class="btn ticket-submit" id="entrySubmit" onclick="submitEntry()">计算并保存</button>
          </div>
          <p class="entry-context" id="entryContext">使用当前实时市场价与银行牌价计算</p>
        </section>

        <aside class="result-summary" id="entryResult" role="status" aria-live="polite">
          <div class="result-empty">录入后显示计算结果</div>
        </aside>
      </div>
      <div class="recent-activity" id="entryRecent" role="status" aria-live="polite">暂无录入记录</div>
    </div>

    <div class="tab-pane" id="tab-chart" role="tabpanel" aria-labelledby="chartTab">
      <div class="chart-heading">
        <span class="section-kicker">HISTORICAL TREND</span>
        <h2>历史报价图表</h2>
      </div>
      <div class="form-grid chart-controls">
        <label class="field">货币对
          <select id="chartPair" onchange="loadChart()">
            <option>USDCNY</option><option>EURCNY</option><option>HKDCNY</option><option>JPYCNY</option>
          </select>
        </label>
        <label class="field">银行
          <select id="chartBank" onchange="loadChart()">
            <option>中国银行</option><option>招商银行</option>
            <option>建设银行</option><option>杭州银行</option>
            <option>工商银行</option><option>农业银行</option>
            <option>邮储银行</option><option>民生银行</option>
          </select>
        </label>
        <label class="field">日期
          <input type="date" id="chartDate" onchange="loadChart()">
        </label>
      </div>
      <div id="chart" role="img" aria-label="所选货币对与银行的历史报价趋势图"></div>
    </div>
  </div>
</section>
</main>

<script>
// ── 全局状态 ──
let chartInstance = null;
let chartRequestId = 0;
window.addEventListener('resize', () => { if (chartInstance) chartInstance.resize(); });

// ── Tab 切换 ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => {
      const active = b === btn;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', String(active));
      document.getElementById('tab-' + b.dataset.tab).classList.toggle('active', active);
    });
    if (btn.dataset.tab === 'chart') setTimeout(() => loadChart(), 50);
  });
});

// ── 报价栏渲染 ──
const PAIRS = ["USDCNY", "EURCNY", "HKDCNY", "JPYCNY"];
const BANK_NAMES = [
  "中国银行", "招商银行", "建设银行", "杭州银行",
  "工商银行", "农业银行", "邮储银行", "民生银行"
];
let activePair = "USDCNY";
let latestQuotes = null;

function selectPair(pair) {
  if (!PAIRS.includes(pair)) return;
  const pairChanged = pair !== activePair;
  activePair = pair;
  if (pairChanged) invalidateEntrySubmission();
  document.getElementById('entryPair').value = pair;
  document.getElementById('chartPair').value = pair;
  chartRequestId += 1;
  if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
  document.getElementById('chart').innerHTML = '<div class="loading">加载图表中...</div>';
  const entryPairLabel = document.getElementById('activeEntryPair');
  if (entryPairLabel) entryPairLabel.textContent = pair;
  renderPairTabs();
  if (latestQuotes) {
    renderQuotes(latestQuotes.cfets, latestQuotes.banks, latestQuotes.timestamp);
  }
  loadChart();
}

function renderPairTabs() {
  const tabs = document.getElementById('pairTabs');
  tabs.replaceChildren(...PAIRS.map(pair => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'pair-tab' + (pair === activePair ? ' active' : '');
    button.dataset.pair = pair;
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-selected', String(pair === activePair));
    button.textContent = pair;
    button.addEventListener('click', () => selectPair(pair));
    return button;
  }));
}

function renderQuoteSkeleton() {
  const cards = BANK_NAMES.map(() =>
    '<div class="bank-quote skeleton-quote" aria-hidden="true">'
    + '<span class="skeleton-line"></span><span class="skeleton-line"></span></div>'
  ).join('');
  document.getElementById('quotesContainer').innerHTML =
    '<div role="status" aria-live="polite" aria-label="正在加载外汇报价">'
    + '<div class="bank-quote-board skeleton-board">' + cards + '</div></div>';
}

function showInlineError(containerId, message) {
  const container = document.getElementById(containerId);
  const error = document.createElement('div');
  error.className = 'inline-state inline-error';
  error.setAttribute('role', 'status');
  error.setAttribute('aria-live', 'polite');
  error.textContent = message;
  container.replaceChildren(error);
}

function parsePositivePrice(value) {
  if (typeof value !== 'number' && typeof value !== 'string') return null;
  if (typeof value === 'string' && value.trim() === '') return null;
  const price = Number(value);
  return Number.isFinite(price) && price > 0 ? price : null;
}

function formatQuoteTime(value) {
  if (typeof value !== 'string') return null;
  const match = value.match(
    /^\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):([0-5]\d):[0-5]\d$/
  );
  return match ? match[1] + ':' + match[2] : null;
}

function renderQuotes(cfets, banks, timestamp) {
  latestQuotes = {cfets, banks, timestamp};
  const pair = activePair;
  const market = cfets[pair] || {};
  const marketMid = parsePositivePrice(market.mid);
  const hasMarketMid = marketMid !== null;
  document.getElementById('marketReferenceValue').textContent = hasMarketMid
    ? marketMid.toFixed(4) : '--';
  document.getElementById('marketReferenceState').textContent = hasMarketMid
    ? '市场中间价' : '暂无新数据';
  document.getElementById('updateTime').textContent = '最后更新 ' + (timestamp || '--');

  const cards = BANK_NAMES.map(bank => {
    const quote = (banks[bank] && banks[bank][pair]) || {};
    const bidValue = parsePositivePrice(quote.bid);
    const askValue = parsePositivePrice(quote.ask);
    const hasBid = bidValue !== null;
    const hasAsk = askValue !== null;
    const bid = hasBid ? bidValue.toFixed(4) : '--';
    const ask = hasAsk ? askValue.toFixed(4) : '--';
    const sourceTime = formatQuoteTime(quote.source_time);
    const fetchTime = formatQuoteTime(quote.fetch_time);
    let meta = '等待数据';
    if (sourceTime) {
      meta = '源 ' + sourceTime;
    } else if (fetchTime) {
      meta = (quote.fetch_time === timestamp ? '本轮抓取 ' : '上次抓取 ')
        + fetchTime;
    } else if (hasBid || hasAsk) {
      meta = '真实报价';
    }
    const statusClass = hasBid && hasAsk ? 'ok' : (hasBid || hasAsk ? 'partial' : 'missing');
    const status = hasBid && hasAsk ? '正常' : (hasBid || hasAsk ? '部分缺失' : '暂无新数据');
    return '<article class="bank-quote" role="listitem" data-source="' + bank + '" aria-label="'
      + bank + ' ' + pair + ' 买入 ' + bid + '，卖出 ' + ask + '">'
      + '<div class="bank-quote-head"><span>' + bank + '</span><small>' + meta + '</small></div>'
      + '<div class="bank-price-line"><span class="buy">' + bid + '</span><span class="sell">' + ask + '</span></div>'
      + '<div class="bank-price-labels"><span>买入</span><span>卖出</span></div>'
      + '<div class="quote-status ' + statusClass + '">' + status + '</div></article>';
  }).join('');
  document.getElementById('quotesContainer').innerHTML =
    '<div class="bank-quote-board" role="list" aria-label="' + pair + ' 银行报价">'
    + cards + '</div>';
}

// ── 获取报价 ──
async function fetchQuotes() {
  try {
    const res = await fetch('/api/quotes');
    if (!res.ok) throw new Error('quotes request failed: ' + res.status);
    const data = await res.json();
    renderQuotes(data.cfets || {}, data.banks || {}, data.timestamp);
  } catch(e) {
    console.error('fetchQuotes error:', e);
    latestQuotes = null;
    showInlineError('quotesContainer', '报价暂时无法获取，系统将在下一轮自动重试');
  }
}

// ── 图表 ──
const LINE_STYLE = [
  {name:'银行卖价', color:'#ff857a', width:1.5},
  {name:'银行成本', color:'#d8a84e', width:1.5, type:'dashed'},
  {name:'市场成本', color:'#98a6ae', width:1.5},
  {name:'银行买价', color:'#56d8b3', width:1.5},
];

async function loadChart() {
  const requestId = ++chartRequestId;
  const pair = document.getElementById('chartPair').value;
  const bank = document.getElementById('chartBank').value;
  const dateInput = document.getElementById('chartDate').value;
  let url = '/api/chart?pair=' + pair + '&bank=' + encodeURIComponent(bank);
  if (dateInput) {
    url += '&date=' + dateInput;
  }
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('chart request failed: ' + res.status);
    const data = await res.json();
    if (requestId !== chartRequestId || pair !== document.getElementById('chartPair').value) return;
    renderChart(data);
  } catch(e) {
    if (requestId !== chartRequestId) return;
    console.error('loadChart error:', e);
    if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
    showInlineError('chart', '图表暂时无法获取，请稍后重试');
  }
}

function renderChart(data) {
  const dom = document.getElementById('chart');
  if (!data.times || data.times.length === 0) {
    dom.innerHTML = '<div class="loading">暂无今日数据</div>';
    if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
    return;
  }

  if (chartInstance) chartInstance.dispose();
  dom.replaceChildren();
  chartInstance = echarts.init(dom);

  const sources = data.sources || [];

  const series = [
    {name:'银行卖价', data:data.asks, color:'#ff857a'},
    {name:'银行成本', data:data.costs, color:'#d8a84e'},
    {name:'市场成本', data:data.mids, color:'#98a6ae'},
    {name:'银行买价', data:data.bids, color:'#56d8b3'},
  ].map((seriesItem, i) => ({
    name: seriesItem.name,
    type: 'line',
    data: seriesItem.data,
    connectNulls: true,
    smooth: false,
    symbol: 'circle',
    symbolSize: 2,
    lineStyle: { color: seriesItem.color, width: LINE_STYLE[i].width, type: LINE_STYLE[i].type || 'solid' },
    itemStyle: { color: seriesItem.color },
  }));

  chartInstance.setOption({
    backgroundColor: '#0e1620',
    grid: { left: 54, right: 18, top: 38, bottom: 32 },
    tooltip: {
      trigger: 'axis',
      backgroundColor: 'rgba(14,22,32,.96)',
      borderColor: '#2a3b47',
      textStyle: { color: '#dce5e8', fontSize: 12 },
      formatter: function(params) {
        const time = params[0].axisValue;
        let html = '<div>' + time + '</div>';
        const colors = ['#ff857a','#d8a84e','#98a6ae','#56d8b3'];
        const names = ['银行卖价','银行成本','市场成本','银行买价'];
        for (let i = 0; i < params.length; i++) {
          if (params[i].value != null) {
            let label = names[i];
            if (i === 2 && sources.length > 0) {
              const idx = data.times.indexOf(time);
              const src = idx >= 0 && idx < sources.length ? sources[idx] : '';
              if (src === '精确') label += ' <span style="color:#56d8b3">●</span>';
              else if (src === '推导') label += ' <span style="color:#d8a84e">○</span>';
            }
            html += '<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + colors[i] + ';margin-right:6px;"></span>'
              + label + ' ' + params[i].value.toFixed(4) + '</div>';
          }
        }
        return html;
      }
    },
    legend: {
      data: ['银行卖价','银行成本','市场成本','银行买价'],
      textStyle: { color: '#91a1a8', fontSize: 10 },
      top: 8,
    },
    xAxis: {
      type: 'category',
      data: data.times,
      axisLine: { lineStyle: { color: '#2c3b46' } },
      axisLabel: { color: '#7f9098', fontSize: 10 },
      splitLine: { show: true, lineStyle: { color: '#192833', width: 0.5 } },
    },
    yAxis: {
      type: 'value',
      scale: true,
      axisLine: { lineStyle: { color: '#2c3b46' } },
      axisLabel: { color: '#7f9098', fontSize: 10, formatter: function(v) { return v.toFixed(4); } },
      splitLine: { show: true, lineStyle: { color: '#192833', width: 0.5 } },
    },
    series: series,
    dataZoom: [
      { type: 'inside', start: 0, end: 100 },
    ],
  });

  chartInstance.on('click', function() {});
}

// ── 录入报价 ──
let entryTimeMode = 'current';
let entrySubmissionPending = false;
let entrySubmissionId = 0;

function invalidateEntrySubmission() {
  entrySubmissionId += 1;
}

function setEntryTimeMode(mode) {
  const nextMode = mode === 'historical' ? 'historical' : 'current';
  if (nextMode !== entryTimeMode) invalidateEntrySubmission();
  entryTimeMode = nextMode;
  const historical = entryTimeMode === 'historical';
  document.getElementById('historicalTimeFields').hidden = !historical;
  document.getElementById('entryTimeCurrent').setAttribute('aria-pressed', String(!historical));
  document.getElementById('entryTimeHistorical').setAttribute('aria-pressed', String(historical));
  document.getElementById('entryContext').textContent = historical
    ? '将使用所选历史时点对应的市场价与银行牌价计算'
    : '使用当前实时市场价与银行牌价计算';
}

document.getElementById('entryTimeCurrent').addEventListener('click', () => setEntryTimeMode('current'));
document.getElementById('entryTimeHistorical').addEventListener('click', () => setEntryTimeMode('historical'));
['entryBank', 'entryDir', 'entryQuote', 'entryDate', 'entryTime'].forEach(id => {
  document.getElementById(id).addEventListener('change', invalidateEntrySubmission);
});
['entryQuote', 'entryDate', 'entryTime'].forEach(id => {
  document.getElementById(id).addEventListener('input', invalidateEntrySubmission);
});

function describeSignedResult(value, positiveLabel, negativeLabel) {
  if (typeof value !== 'number' && typeof value !== 'string') return null;
  if (typeof value === 'string' && value.trim() === '') return null;
  const numeric = Number(value);
  if (!Number.isFinite(numeric)) return null;
  if (numeric > 0) return {label: positiveLabel, value: Math.abs(numeric), tone: 'positive'};
  if (numeric < 0) return {label: negativeLabel, value: Math.abs(numeric), tone: 'negative'};
  return {label: '持平', value: 0, tone: 'neutral'};
}

function renderEntryResult(data, bank) {
  const market = describeSignedResult(data.bp_vs_market, '你赚', '你亏');
  const board = describeSignedResult(data.bp_vs_bank_price, '优惠', '更差');
  const bankReference = bank + '牌价';
  const root = document.getElementById('entryResult');
  if (!market || !board) {
    root.textContent = '结果数据不完整，请稍后重试';
    return;
  }
  const makeRow = (prefix, result) => {
    const row = document.createElement('div');
    const label = document.createElement('div');
    const value = document.createElement('div');
    row.className = 'result-row ' + result.tone;
    label.className = 'result-label';
    value.className = 'result-value';
    label.textContent = prefix + result.label + '：';
    value.textContent = result.value.toFixed(1) + ' bp';
    row.append(label, value);
    return row;
  };
  root.replaceChildren(
    makeRow('对比市场成本，', market),
    makeRow('对比' + bankReference + '，', board),
  );
}

async function submitEntry() {
  if (entrySubmissionPending) return;
  const snapshot = {
    pair: activePair,
    bank: document.getElementById('entryBank').value,
    dir: document.getElementById('entryDir').value,
    quote: parseFloat(document.getElementById('entryQuote').value),
    timeMode: entryTimeMode,
    date: document.getElementById('entryDate').value,
    time: document.getElementById('entryTime').value,
  };
  if (snapshot.timeMode === 'historical' && (!snapshot.date || !snapshot.time)) {
    document.getElementById('entryResult').textContent = '请选择完整的历史日期和时间';
    return;
  }
  if (isNaN(snapshot.quote)) { document.getElementById('entryResult').textContent = '请输入有效的报价数字'; return; }

  const submissionId = ++entrySubmissionId;
  const submitButton = document.getElementById('entrySubmit');
  entrySubmissionPending = true;
  submitButton.disabled = true;
  try {
    let url = '/api/entry?pair=' + snapshot.pair + '&bank=' + encodeURIComponent(snapshot.bank) + '&direction=' + encodeURIComponent(snapshot.dir) + '&quote=' + snapshot.quote;
    if (snapshot.timeMode === 'historical') {
      url += '&time=' + encodeURIComponent(snapshot.date + 'T' + snapshot.time);
    }
    const res = await fetch(url, { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      if (submissionId === entrySubmissionId) {
        document.getElementById('entryResult').textContent = data.error || '提交失败，请稍后重试';
      }
      return;
    }
    if (submissionId === entrySubmissionId) renderEntryResult(data, snapshot.bank);
    loadEntries();
  } catch(e) {
    console.error('submitEntry error:', e);
    if (submissionId === entrySubmissionId) {
      document.getElementById('entryResult').textContent = '提交失败，请稍后重试';
    }
  } finally {
    entrySubmissionPending = false;
    submitButton.disabled = false;
  }
}

async function loadEntries() {
  try {
    const res = await fetch('/api/entries?limit=10');
    if (!res.ok) throw new Error('entries request failed: ' + res.status);
    const data = await res.json();
    const el = document.getElementById('entryRecent');
    if (!data.entries || data.entries.length === 0) {
      el.textContent = '暂无录入记录';
      return;
    }
    const fragment = document.createDocumentFragment();
    data.entries.forEach(entry => {
      const item = document.createElement('article');
      const main = document.createElement('div');
      const meta = document.createElement('div');
      const quote = Number(entry.quote);
      main.className = 'recent-entry-main';
      meta.className = 'recent-entry-meta';
      item.className = 'recent-entry';
      main.textContent = entry.pair + ' · ' + entry.bank;
      meta.textContent = entry.time + ' · ' + entry.direction + ' '
        + (Number.isFinite(quote) ? quote.toFixed(4) : '--')
        + ' · 银行赚 ' + entry.bp_vs_market + 'bp';
      item.append(main, meta);
      fragment.append(item);
    });
    el.replaceChildren(fragment);
  } catch(e) {
    console.error('loadEntries error:', e);
    showInlineError('entryRecent', '最近录入暂时无法获取，请稍后重试');
  }
}

// ── 日期选择器初始化为今天 ──
(function initDatePicker() {
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth() + 1).padStart(2, '0');
  const d = String(today.getDate()).padStart(2, '0');
  document.getElementById('chartDate').value = y + '-' + m + '-' + d;
})();

// ── 自动刷新 ──
renderPairTabs();
renderQuoteSkeleton();
fetchQuotes();
loadChart();
loadEntries();
setInterval(fetchQuotes, 15000);   // 报价每 15 秒刷新
setInterval(loadChart, 60000);     // 图表每分钟刷新（保持当天数据更新）
</script>
