<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>实时外汇监控系统</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--page:#070b10;--panel:#0e1620;--panel-raised:#131e29;--line:#20303d;--line-soft:#182630;--text:#dce5e8;--muted:#7f9098;--accent:#56d8b3;--bid:#56d8b3;--ask:#ff857a;--warn:#d8a84e;--danger:#e77770}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--page);color:var(--text);min-height:100vh;overflow-x:hidden}
.app-shell{width:min(calc(100% - 32px),1400px);max-width:1400px;margin:0 auto;padding:18px 0 28px}

/* ── Header ── */
.terminal-header{min-height:76px;padding:15px 18px;border:1px solid var(--line);border-bottom-color:var(--accent);background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:18px}
.terminal-brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{width:42px;height:42px;border:1px solid rgba(86,216,179,.58);background:rgba(86,216,179,.08);color:var(--accent);display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:.08em}
.brand-copy h1{font-size:18px;line-height:1.25;color:var(--text);font-weight:650;letter-spacing:.02em}
.brand-copy p{margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.18em}
.terminal-state{display:flex;align-items:flex-end;flex-direction:column;gap:6px;white-space:nowrap}
.live-status{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:12px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(86,216,179,.09)}
.update-time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── Panels ── */
.panel{background:var(--panel);border:1px solid var(--line)}
.quote-panel{margin-top:12px;padding:0 14px 14px}
.panel-heading{min-height:57px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line-soft)}
.panel-title{display:flex;align-items:baseline;gap:11px}
.panel-heading h2{font-size:14px;font-weight:650;color:var(--text)}
.panel-kicker{font-size:9px;letter-spacing:.16em;color:var(--muted)}
.quote-legend{display:flex;align-items:center;gap:14px;font-size:11px}
.quote-legend span{display:flex;align-items:center;gap:6px}
.legend-swatch{width:10px;height:2px;background:currentColor}
.legend-bid{color:var(--bid)}
.legend-ask{color:var(--ask)}

/* ── Quote Matrix ── */
.quotes{overflow-x:auto;padding-top:12px}
.quote-matrix{min-width:900px;background:var(--panel);border:1px solid var(--line-soft);overflow:visible}
.quote-head,.source-row{display:grid;grid-template-columns:150px repeat(4,minmax(145px,1fr)) 100px;align-items:center}
.quote-head{min-height:42px;background:var(--panel-raised);color:var(--muted);font-size:10px;border-bottom:1px solid var(--line);text-align:center}
.quote-head>div{padding:8px 6px}
.quote-head .source-name{text-align:left;padding-left:14px;position:sticky;left:0;z-index:3;background:var(--panel-raised)}
.quote-head b{display:block;color:var(--text);font-size:11px;font-weight:650;letter-spacing:.04em}
.quote-head .buy-label{color:var(--bid);margin-right:9px}
.quote-head .sell-label{color:var(--ask)}
.source-row{min-height:54px;border-bottom:1px solid var(--line-soft);transition:background-color .14s ease}
.source-row:last-child{border-bottom:0}
.source-row.cfets{background:rgba(86,216,179,.045)}
.source-row:hover{background:rgba(220,229,232,.035)}
.source-name{font-size:12px;font-weight:700;color:var(--text);padding-left:14px;white-space:nowrap}
.source-row .source-name{position:sticky;left:0;z-index:2;background:var(--panel);align-self:stretch;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px}
.source-row.cfets .source-name{background:#101d25}
.source-row:hover .source-name{background:#111b25}
.source-time{display:block;color:var(--muted);font-size:9px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.quote-cell{text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums}
.quote-cell .buy{color:var(--bid);font-weight:650;margin-right:10px}
.quote-cell .sell{color:var(--ask);font-weight:650}
.quote-status{text-align:center;color:var(--muted);font-size:9px;line-height:1.35}
.quote-status.ok{color:var(--accent)}
.quote-status.partial{color:var(--warn)}
.quote-status.missing{color:var(--danger)}

/* ── Quote Workspace ── */
.workspace-panel{margin-top:12px;overflow:hidden}
.workspace-tabs{display:flex;align-items:center;gap:2px;padding:0 14px;background:var(--panel-raised);border-bottom:1px solid var(--line)}
.tab-btn{appearance:none;min-width:120px;padding:14px 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:650;letter-spacing:.03em;cursor:pointer;transition:color .14s ease,background-color .14s ease,border-color .14s ease}
.tab-btn:hover{color:var(--text);background:rgba(220,229,232,.03)}
.tab-btn:focus-visible{outline:1px solid var(--accent);outline-offset:-3px}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(86,216,179,.055)}
.tab-content{padding:16px;min-height:330px}
.tab-pane{display:none}
.tab-pane.active{display:block}
.entry-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:14px}
.entry-panel,.recent-panel{padding:16px;border:1px solid var(--line-soft);background:var(--panel-raised)}
.section-kicker{display:block;margin-bottom:6px;color:var(--muted);font-size:9px;line-height:1.2;letter-spacing:.17em}
.entry-panel h2,.recent-panel h2,.chart-heading h2{color:var(--text);font-size:14px;font-weight:650}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.field{display:flex;min-width:0;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.field-wide{grid-column:1/-1}
.field select,.field input{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--page);color:var(--text);font:inherit;font-size:13px;outline:none}
.field select:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(86,216,179,.08)}
.field input::placeholder{color:var(--muted)}
.form-actions{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:2px}
.btn{appearance:none;min-height:38px;padding:8px 17px;border:1px solid var(--accent);border-radius:2px;background:var(--accent);color:var(--page);font:inherit;font-size:12px;font-weight:750;cursor:pointer;transition:background-color .14s ease,color .14s ease}
.btn:hover{background:#70e2c1}
.btn:focus-visible{outline:1px solid var(--text);outline-offset:2px}
.btn-secondary{border-color:var(--line);background:transparent;color:var(--text)}
.btn-secondary:hover{border-color:var(--muted);background:rgba(220,229,232,.04)}
.result-card{min-height:92px;margin-top:14px;padding:13px 14px;border:1px solid var(--line);border-left:2px solid var(--accent);background:var(--panel);color:var(--muted);font-size:12px;line-height:1.65}
.result-card b{color:var(--text);font-weight:650}
.result-positive{color:var(--bid);font-weight:700}
.result-negative{color:var(--ask);font-weight:700}
.recent-list{margin-top:14px;color:var(--muted);font-size:11px}
.recent-entry{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.recent-entry:first-child{padding-top:0}
.recent-entry:last-child{border-bottom:0}
.recent-entry-main{color:var(--text);font-size:12px;font-weight:650}
.recent-entry-meta{margin-top:4px;color:var(--muted);font-size:10px;line-height:1.5;font-variant-numeric:tabular-nums}
.inline-state{display:grid;min-height:112px;place-items:center;padding:20px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.inline-error{color:var(--danger);border:1px solid rgba(231,119,112,.28);background:rgba(231,119,112,.045)}
.skeleton-matrix .source-row{pointer-events:none}
.skeleton-line{display:inline-block;width:58px;height:8px;border-radius:1px;background:var(--line);vertical-align:middle}
.skeleton-line+.skeleton-line{margin-left:10px;width:48px;background:var(--line-soft)}

/* ── Chart ── */
.chart-heading{margin-bottom:14px}
.chart-controls{grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 14px}
#chart{width:100%;height:400px}
@media(max-width:600px){#chart{height:300px}}

/* ── Loading ── */
.loading{text-align:center;padding:40px;color:#666;font-size:14px}

/* ── Responsive ── */
@media(max-width:640px){
  .app-shell{width:min(calc(100% - 20px),1400px);padding-top:10px}
  .terminal-header{align-items:flex-start;flex-direction:column}
  .terminal-state{align-items:flex-start}
  .panel-heading{align-items:flex-start;flex-direction:column;padding:12px 0}
  .quote-matrix{min-width:900px}
  .quote-head,.source-row{grid-template-columns:130px repeat(4,minmax(145px,1fr)) 90px}
  .source-name{padding-left:8px}
}
</style>
</head>
<body>
<main class="app-shell">

<!-- Header -->
<header class="terminal-header">
  <div class="terminal-brand">
    <div class="brand-mark" aria-hidden="true">FX</div>
    <div class="brand-copy">
      <h1>外汇报价工作台</h1>
      <p>FOREIGN EXCHANGE MONITOR</p>
    </div>
  </div>
  <div class="terminal-state">
    <div class="live-status"><span class="status-dot" aria-hidden="true"></span><span>实时采集中</span></div>
    <span class="update-time" id="updateTime">最后更新 --</span>
  </div>
</header>

<!-- Quotes -->
<section class="panel quote-panel" aria-labelledby="quotePanelTitle">
  <div class="panel-heading">
    <div class="panel-title">
      <span class="panel-kicker">MARKET MATRIX</span>
      <h2 id="quotePanelTitle">实时银行报价</h2>
    </div>
    <div class="quote-legend" aria-label="报价颜色图例">
      <span class="legend-bid"><i class="legend-swatch" aria-hidden="true"></i>买入</span>
      <span class="legend-ask"><i class="legend-swatch" aria-hidden="true"></i>卖出</span>
    </div>
  </div>
  <div class="quotes" id="quotesContainer">
    <div class="loading">加载报价中...</div>
  </div>
</section>

<!-- Quote Entry Workspace -->
<section class="panel workspace-panel">
  <nav class="workspace-tabs" role="tablist" aria-label="报价工作区">
    <button class="tab-btn active" id="entryTab" type="button" role="tab" aria-selected="true" aria-controls="tab-entry" data-tab="entry">录入报价</button>
    <button class="tab-btn" id="chartTab" type="button" role="tab" aria-selected="false" aria-controls="tab-chart" data-tab="chart">历史图表</button>
  </nav>

  <div class="tab-content">
    <div class="tab-pane active" id="tab-entry" role="tabpanel" aria-labelledby="entryTab">
      <div class="entry-layout">
        <section class="entry-panel" aria-labelledby="entryPanelTitle">
          <span class="section-kicker">QUOTE ENTRY</span>
          <h2 id="entryPanelTitle">录入客户报价</h2>
          <div class="form-grid">
            <label class="field">货币对
              <select id="entryPair">
                <option>USDCNY</option><option>EURCNY</option><option>HKDCNY</option><option>JPYCNY</option>
              </select>
            </label>
            <label class="field">银行
              <select id="entryBank">
                <option>中国银行</option><option>招商银行</option>
                <option>建设银行</option><option>杭州银行</option>
                <option>工商银行</option><option>农业银行</option>
                <option>邮储银行</option><option>民生银行</option>
              </select>
            </label>
            <label class="field">方向
              <select id="entryDir">
                <option>买入价</option><option>卖出价</option>
              </select>
            </label>
            <label class="field">报价
              <input type="number" id="entryQuote" step="0.0001" inputmode="decimal" placeholder="7.2400">
            </label>
            <label class="field">日期
              <input type="date" id="entryDate">
            </label>
            <label class="field">时间
              <input type="time" id="entryTime">
            </label>
            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="document.getElementById('entryDate').value='';document.getElementById('entryTime').value=''">现在</button>
              <button type="button" class="btn" onclick="submitEntry()">录入并计算</button>
            </div>
          </div>
          <div class="result-card" id="entryResult" role="status" aria-live="polite">录入后显示计算结果</div>
        </section>

        <aside class="recent-panel" aria-labelledby="recentPanelTitle">
          <span class="section-kicker">RECENT ENTRIES</span>
          <h2 id="recentPanelTitle">最近录入</h2>
          <div class="recent-list" id="entryRecent" role="status" aria-live="polite">暂无录入记录</div>
        </aside>
      </div>
    </div>

    <div class="tab-pane" id="tab-chart" role="tabpanel" aria-labelledby="chartTab">
      <div class="chart-heading">
        <span class="section-kicker">HISTORICAL TREND</span>
        <h2>历史报价图表</h2>
      </div>
      <div class="form-grid chart-controls">
        <label class="field">货币对
          <select id="chartPair" onchange="loadChart()">
            <option>USDCNY</option><option>EURCNY</option><option>HKDCNY</option><option>JPYCNY</option>
          </select>
        </label>
        <label class="field">银行
          <select id="chartBank" onchange="loadChart()">
            <option>中国银行</option><option>招商银行</option>
            <option>建设银行</option><option>杭州银行</option>
            <option>工商银行</option><option>农业银行</option>
            <option>邮储银行</option><option>民生银行</option>
          </select>
        </label>
        <label class="field">日期
          <input type="date" id="chartDate" onchange="loadChart()">
        </label>
      </div>
      <div id="chart" role="img" aria-label="所选货币对与银行的历史报价趋势图"></div>
    </div>
  </div>
</section>
</main>

<script>
// ── 全局状态 ──
let chartInstance = null;

// ── Tab 切换 ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => {
      const active = b === btn;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', String(active));
      document.getElementById('tab-' + b.dataset.tab).classList.toggle('active', active);
    });
    if (btn.dataset.tab === 'chart') setTimeout(() => { if (chartInstance) chartInstance.resize(); else loadChart(); }, 50);
  });
});

// ── 报价栏渲染 ──
const PAIRS = ["USDCNY","EURCNY","HKDCNY","JPYCNY"];
const BANK_NAMES = [
  "CFETS","中国银行","招商银行","建设银行","杭州银行",
  "工商银行","农业银行","邮储银行","民生银行"
];

function renderQuoteSkeleton() {
  const el = document.getElementById('quotesContainer');
  let html = '<div role="status" aria-live="polite" aria-label="正在加载外汇报价">'
    + '<div class="quote-matrix skeleton-matrix" role="table" aria-label="外汇报价加载骨架">'
    + '<div class="quote-head" role="row"><div class="source-name" role="columnheader">数据来源</div>'
    + PAIRS.map(pair => '<div role="columnheader"><b>' + pair + '</b><span class="buy-label">买入</span><span class="sell-label">卖出</span></div>').join('')
    + '<div role="columnheader">状态</div></div>';
  html += BANK_NAMES.map(source =>
    '<div class="source-row" role="row"><div class="source-name" role="rowheader"><span>' + source + '</span></div>'
    + PAIRS.map(() => '<div class="quote-cell" role="cell"><span class="skeleton-line"></span><span class="skeleton-line"></span></div>').join('')
    + '<div class="quote-status" role="cell"><span class="skeleton-line"></span></div></div>'
  ).join('');
  el.innerHTML = html + '</div></div>';
}

function showInlineError(containerId, message) {
  const container = document.getElementById(containerId);
  const error = document.createElement('div');
  error.className = 'inline-state inline-error';
  error.setAttribute('role', 'status');
  error.setAttribute('aria-live', 'polite');
  error.textContent = message;
  container.replaceChildren(error);
}

function renderQuotes(cfets, banks, timestamp) {
  const el = document.getElementById('quotesContainer');
  document.getElementById('updateTime').textContent = '最后更新 ' + (timestamp || '--');
  let html = '<div class="quote-matrix" role="table" aria-label="外汇买入卖出报价矩阵"><div class="quote-head" role="row">'
    + '<div class="source-name" role="columnheader">数据来源</div>'
    + PAIRS.map(pair => '<div role="columnheader"><b>' + pair + '</b><span class="buy-label">买入</span><span class="sell-label">卖出</span></div>').join('')
    + '<div role="columnheader">状态</div></div>';

  for (const source of BANK_NAMES) {
    let cells = '';
    let validPairCount = 0;
    let hasAnyQuote = false;
    let sourceTime = '';
    let fetchTime = '';
    for (const pair of PAIRS) {
      const quote = source === 'CFETS' ? (cfets[pair] || {}) : ((banks[source] && banks[source][pair]) || {});
      const bidValue = Number(quote.bid);
      const askValue = Number(quote.ask);
      const hasBid = quote.bid != null && String(quote.bid).trim() !== '' && Number.isFinite(bidValue);
      const hasAsk = quote.ask != null && String(quote.ask).trim() !== '' && Number.isFinite(askValue);
      const bid = hasBid ? bidValue.toFixed(4) : '--';
      const ask = hasAsk ? askValue.toFixed(4) : '--';
      if (hasBid && hasAsk) validPairCount += 1;
      if (hasBid || hasAsk) hasAnyQuote = true;
      if (!sourceTime && quote.source_time) sourceTime = quote.source_time;
      if (!fetchTime && quote.fetch_time) fetchTime = quote.fetch_time;
      cells += '<div class="quote-cell" role="cell" aria-label="' + source + ' ' + pair
        + ' 买入 ' + bid + '，卖出 ' + ask + '"><span class="buy">' + bid
        + '</span><span class="sell">' + ask + '</span></div>';
    }

    let sourceMeta = '市场中间价';
    if (source !== 'CFETS' && sourceTime) {
      sourceMeta = '源 ' + sourceTime.slice(11, 16);
    } else if (source !== 'CFETS' && fetchTime) {
      const label = fetchTime === timestamp ? '本轮抓取' : '上次抓取';
      sourceMeta = label + ' ' + fetchTime.slice(11, 16);
    } else if (source !== 'CFETS') {
      sourceMeta = hasAnyQuote ? '真实报价' : '等待数据';
    }

    let statusClass = 'ok';
    let statusText = source === 'CFETS' ? '市场基准' : '正常';
    if (!hasAnyQuote) {
      statusClass = 'missing';
      statusText = '暂无新数据';
    } else if (validPairCount < PAIRS.length) {
      statusClass = 'partial';
      statusText = '部分缺失';
    }
    html += '<div class="source-row' + (source === 'CFETS' ? ' cfets' : '') + '" role="row" data-source="' + source + '">'
      + '<div class="source-name" role="rowheader"><span>' + source + '</span><small class="source-time">'
      + sourceMeta + '</small></div>' + cells
      + '<div class="quote-status ' + statusClass + '" role="cell">' + statusText + '</div></div>';
  }
  el.innerHTML = html + '</div>';
}

// ── 获取报价 ──
async function fetchQuotes() {
  try {
    const res = await fetch('/api/quotes');
    if (!res.ok) throw new Error('quotes request failed: ' + res.status);
    const data = await res.json();
    renderQuotes(data.cfets || {}, data.banks || {}, data.timestamp);
  } catch(e) {
    console.error('fetchQuotes error:', e);
    showInlineError('quotesContainer', '报价暂时无法获取，系统将在下一轮自动重试');
  }
}

// ── 图表 ──
const LINE_STYLE = [
  {name:'银行卖价', color:'#ef4444', width:1.5},
  {name:'银行成本', color:'#f59e0b', width:1.5, type:'dashed'},
  {name:'市场成本', color:'#9ca3af', width:1.5},
  {name:'银行买价', color:'#22c55e', width:1.5},
];

async function loadChart() {
  const pair = document.getElementById('chartPair').value;
  const bank = document.getElementById('chartBank').value;
  const dateInput = document.getElementById('chartDate').value;
  let url = '/api/chart?pair=' + pair + '&bank=' + encodeURIComponent(bank);
  if (dateInput) {
    url += '&date=' + dateInput;
  }
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('chart request failed: ' + res.status);
    const data = await res.json();
    renderChart(data);
  } catch(e) {
    console.error('loadChart error:', e);
    if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
    showInlineError('chart', '图表暂时无法获取，请稍后重试');
  }
}

function renderChart(data) {
  const dom = document.getElementById('chart');
  if (!data.times || data.times.length === 0) {
    dom.innerHTML = '<div class="loading">暂无今日数据</div>';
    if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
    return;
  }

  if (chartInstance) chartInstance.dispose();
  dom.replaceChildren();
  chartInstance = echarts.init(dom);

  const sources = data.sources || [];

  const series = [
    {name:'银行卖价', data:data.asks, color:'#ef4444'},
    {name:'银行成本', data:data.costs, color:'#f59e0b'},
    {name:'市场成本', data:data.mids, color:'#9ca3af'},
    {name:'银行买价', data:data.bids, color:'#22c55e'},
  ].map((s, i) => ({
    name: s.name,
    type: 'line',
    data: s.data,
    connectNulls: true,
    smooth: false,
    symbol: 'circle',
    symbolSize: 2,
    lineStyle: { width: LINE_STYLE[i].width, type: LINE_STYLE[i].type || 'solid' },
    itemStyle: { color: s.color },
  }));

  chartInstance.setOption({
    backgroundColor: '#1a1a2e',
    grid: { left: 50, right: 16, top: 30, bottom: 28 },
    tooltip: {
      trigger: 'axis',
      backgroundColor: 'rgba(26,26,46,0.95)',
      borderColor: '#444',
      textStyle: { color: '#ccc', fontSize: 12 },
      formatter: function(params) {
        const time = params[0].axisValue;
        let html = '<div>' + time + '</div>';
        const colors = ['#ef4444','#f59e0b','#9ca3af','#22c55e'];
        const names = ['银行卖价','银行成本','市场成本','银行买价'];
        for (let i = 0; i < params.length; i++) {
          if (params[i].value != null) {
            let label = names[i];
            if (i === 2 && sources.length > 0) {
              const idx = data.times.indexOf(time);
              const src = idx >= 0 && idx < sources.length ? sources[idx] : '';
              if (src === '精确') label += ' <span style="color:#22c55e">●</span>';
              else if (src === '推导') label += ' <span style="color:#f59e0b">○</span>';
            }
            html += '<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + colors[i] + ';margin-right:6px;"></span>'
              + label + ' ' + params[i].value.toFixed(4) + '</div>';
          }
        }
        return html;
      }
    },
    legend: {
      data: ['银行卖价','银行成本','市场成本','银行买价'],
      textStyle: { color: '#aaa', fontSize: 10 },
      top: 2,
    },
    xAxis: {
      type: 'category',
      data: data.times,
      axisLine: { lineStyle: { color: '#333' } },
      axisLabel: { color: '#888', fontSize: 10 },
      splitLine: { show: true, lineStyle: { color: '#2a2a3e', width: 0.5 } },
    },
    yAxis: {
      type: 'value',
      scale: true,
      axisLine: { lineStyle: { color: '#333' } },
      axisLabel: { color: '#888', fontSize: 10, formatter: function(v) { return v.toFixed(4); } },
      splitLine: { show: true, lineStyle: { color: '#2a2a3e', width: 0.5 } },
    },
    series: series,
    dataZoom: [
      { type: 'inside', start: 0, end: 100 },
    ],
  });

  chartInstance.on('click', function() {});
  window.addEventListener('resize', () => { if (chartInstance) chartInstance.resize(); });
}

// ── 录入报价 ──
async function submitEntry() {
  const pair = document.getElementById('entryPair').value;
  const bank = document.getElementById('entryBank').value;
  const dir = document.getElementById('entryDir').value;
  const quote = parseFloat(document.getElementById('entryQuote').value);
  const entryDate = document.getElementById('entryDate').value;
  const entryTime = document.getElementById('entryTime').value;
  if (isNaN(quote)) { document.getElementById('entryResult').textContent = '请输入有效的报价数字'; return; }

  try {
    let url = '/api/entry?pair=' + pair + '&bank=' + encodeURIComponent(bank) + '&direction=' + encodeURIComponent(dir) + '&quote=' + quote;
    if (entryDate && entryTime) {
      url += '&time=' + encodeURIComponent(entryDate + 'T' + entryTime);
    }
    const res = await fetch(url, { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      document.getElementById('entryResult').textContent = data.error || '提交失败，请稍后重试';
      return;
    }
    const market = data.market_cost.toFixed(4);
    const bankPrice = dir === '买入价' ? data.bank_bid.toFixed(4) : data.bank_ask.toFixed(4);
    const priceLabel = bank + (dir === '买入价' ? '买入价' : '卖出价');
    const compareLabel = data.compare_time || '当前实时';
    const marketClass = data.bp_vs_market >= 0 ? 'result-positive' : 'result-negative';
    const bankClass = data.bp_vs_bank_price >= 0 ? 'result-positive' : 'result-negative';
    document.getElementById('entryResult').innerHTML =
      '▎比较基准：<b>' + compareLabel + '</b><br><br>'
      + '▎对比市场中间价<br>市场成本 ' + market + '，你的报价 ' + quote.toFixed(4) + '<br>银行赚取 <span class="' + marketClass + '">' + data.bp_vs_market + 'bp</span><br><br>'
      + '▎与银行牌价比较<br>' + priceLabel + ' ' + bankPrice + '，你的报价 ' + quote.toFixed(4) + '<br>你比银行牌价<span class="' + bankClass + '">' + (data.bp_vs_bank_price >= 0 ? '优惠' : '更差') + Math.abs(data.bp_vs_bank_price) + 'bp</span>';
    loadEntries();
  } catch(e) {
    console.error('submitEntry error:', e);
    document.getElementById('entryResult').textContent = '提交失败，请稍后重试';
  }
}

async function loadEntries() {
  try {
    const res = await fetch('/api/entries?limit=10');
    if (!res.ok) throw new Error('entries request failed: ' + res.status);
    const data = await res.json();
    const el = document.getElementById('entryRecent');
    if (!data.entries || data.entries.length === 0) {
      el.textContent = '暂无录入记录';
      return;
    }
    const fragment = document.createDocumentFragment();
    data.entries.forEach(entry => {
      const item = document.createElement('article');
      const main = document.createElement('div');
      const meta = document.createElement('div');
      const quote = Number(entry.quote);
      main.className = 'recent-entry-main';
      meta.className = 'recent-entry-meta';
      item.className = 'recent-entry';
      main.textContent = entry.pair + ' · ' + entry.bank;
      meta.textContent = entry.time + ' · ' + entry.direction + ' '
        + (Number.isFinite(quote) ? quote.toFixed(4) : '--')
        + ' · 银行赚 ' + entry.bp_vs_market + 'bp';
      item.append(main, meta);
      fragment.append(item);
    });
    el.replaceChildren(fragment);
  } catch(e) {
    console.error('loadEntries error:', e);
    showInlineError('entryRecent', '最近录入暂时无法获取，请稍后重试');
  }
}

// ── 日期选择器初始化为今天 ──
(function initDatePicker() {
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth() + 1).padStart(2, '0');
  const d = String(today.getDate()).padStart(2, '0');
  document.getElementById('chartDate').value = y + '-' + m + '-' + d;
})();

loadChart();
loadEntries();
setInterval(fetchQuotes, 15000);   // 报价每 15 秒刷新
setInterval(loadChart, 60000);     // 图表每分钟刷新（保持当天数据更新）
</script>
